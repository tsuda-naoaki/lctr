<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="745" viewBox="0 0 1000 745" role="img" aria-labelledby="title desc">
<title id="title">赤・青・緑の入力から、それぞれに割り当てる実数値へ</title><desc id="desc">赤丸c_赤、青三角c_青、緑菱形c_緑は、別々の同値類T_赤、T_青、T_緑に属する。各囲みの中には元の入力を表示する。それぞれ順序座標[T_赤]、[T_青]、[T_緑]へ写し、実数値τ_赤、τ_青、τ_緑を割り当てる。</desc>
