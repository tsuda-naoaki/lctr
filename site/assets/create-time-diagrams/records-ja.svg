<svg xmlns="http://www.w3.org/2000/svg" width="800" height="790" viewBox="0 0 800 790" role="img" aria-labelledby="title desc">
<title id="title">色で見分ける入力と、名前で見分ける記録</title><desc id="desc">赤丸の入力c_赤、青三角の入力c_青、緑菱形の入力c_緑を、それぞれカードAの記録r_A、カードBの記録r_B、カードCの記録r_Cが指定する。スイッチ入力b_A、b_B、b_Cの状態は閉、開、閉。線は対応を示す。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#546573"/></marker></defs>
<style>text{font-family:"Hiragino Sans","Noto Sans CJK JP",Arial,sans-serif} .symbol{font-family:"Times New Roman",serif}</style>
<rect width="800" height="790" rx="16" fill="white"/>
<text x="28" y="42" font-size="28" fill="#223442" font-weight="700" text-anchor="start">色で見分ける入力と、名前で見分ける記録</text>
<text x="28" y="80" font-size="21" fill="#b13434" font-weight="400" text-anchor="start">赤 ●</text>
<text x="195" y="80" font-size="21" fill="#145b93" font-weight="400" text-anchor="start">青 ▲</text>
<text x="398" y="80" font-size="21" fill="#25723f" font-weight="400" text-anchor="start">緑 ◆</text>
<text x="136" y="126" font-size="23" fill="#223442" font-weight="700" text-anchor="middle">カウンタ入力</text>
<text x="325" y="126" font-size="23" fill="#79520e" font-weight="700" text-anchor="start">メモリが保持する記録カード</text>
<circle cx="136" cy="204" r="43" fill="#fff0ee" stroke="#b13434" stroke-width="3"/>
<text x="136" y="212" font-size="31" fill="#b13434" font-weight="600" text-anchor="middle" class="symbol">c<tspan font-size="68%" baseline-shift="-6.2" fill="#b13434">赤</tspan></text>
<text x="136" y="276" font-size="21" fill="#223442" font-weight="400" text-anchor="middle">供給元 K</text>
<text x="136" y="308" font-size="23" fill="#b13434" font-weight="700" text-anchor="middle">赤い位置</text>
<path d="M186 204L325 204" fill="none" stroke="#546573" stroke-width="2.5"/>
<text x="252" y="180" font-size="19" fill="#546573" font-weight="400" text-anchor="middle">対応</text>
<rect x="325" y="151" width="447" height="169" rx="8" fill="#fff4d7" stroke="#79520e" stroke-width="2"/>
<rect x="342" y="164" width="87" height="44" rx="4" fill="white" stroke="#79520e" stroke-width="2"/>
<text x="386" y="194" font-size="30" fill="#79520e" font-weight="700" text-anchor="middle" class="symbol">r<tspan font-size="68%" baseline-shift="-6">A</tspan></text>
<text x="450" y="193" font-size="23" fill="#79520e" font-weight="700" text-anchor="start">記録カード A</text>
<text x="346" y="241" font-size="21" fill="#223442" font-weight="400" text-anchor="start">カウンタ：K / 赤い位置 / c<tspan font-size="68%" baseline-shift="-4.2" fill="#b13434">赤</tspan></text>
<text x="346" y="277" font-size="22" fill="#223442" font-weight="400" text-anchor="start">スイッチ入力：b<tspan font-size="68%" baseline-shift="-4.4">A</tspan></text>
<text x="346" y="308" font-size="22" fill="#223442" font-weight="400" text-anchor="start">その状態：閉</text>
<path d="M136 351L179 437L93 437Z" fill="#e8f3ff" stroke="#145b93" stroke-width="3"/>
<text x="136" y="407" font-size="31" fill="#145b93" font-weight="600" text-anchor="middle" class="symbol">c<tspan font-size="68%" baseline-shift="-6.2" fill="#145b93">青</tspan></text>
<text x="136" y="466" font-size="21" fill="#223442" font-weight="400" text-anchor="middle">供給元 K</text>
<text x="136" y="498" font-size="23" fill="#145b93" font-weight="700" text-anchor="middle">青い位置</text>
<path d="M186 394L325 394" fill="none" stroke="#546573" stroke-width="2.5"/>
<text x="252" y="370" font-size="19" fill="#546573" font-weight="400" text-anchor="middle">対応</text>
<rect x="325" y="341" width="447" height="169" rx="8" fill="#fff4d7" stroke="#79520e" stroke-width="2"/>
<rect x="342" y="354" width="87" height="44" rx="4" fill="white" stroke="#79520e" stroke-width="2"/>
<text x="386" y="384" font-size="30" fill="#79520e" font-weight="700" text-anchor="middle" class="symbol">r<tspan font-size="68%" baseline-shift="-6">B</tspan></text>
<text x="450" y="383" font-size="23" fill="#79520e" font-weight="700" text-anchor="start">記録カード B</text>
<text x="346" y="431" font-size="21" fill="#223442" font-weight="400" text-anchor="start">カウンタ：K / 青い位置 / c<tspan font-size="68%" baseline-shift="-4.2" fill="#145b93">青</tspan></text>
<text x="346" y="467" font-size="22" fill="#223442" font-weight="400" text-anchor="start">スイッチ入力：b<tspan font-size="68%" baseline-shift="-4.4">B</tspan></text>
<text x="346" y="498" font-size="22" fill="#223442" font-weight="400" text-anchor="start">その状態：開</text>
<path d="M136 541L179 584L136 627L93 584Z" fill="#ecf7ec" stroke="#25723f" stroke-width="3"/>
<text x="136" y="592" font-size="31" fill="#25723f" font-weight="600" text-anchor="middle" class="symbol">c<tspan font-size="68%" baseline-shift="-6.2" fill="#25723f">緑</tspan></text>
<text x="136" y="656" font-size="21" fill="#223442" font-weight="400" text-anchor="middle">供給元 K</text>
<text x="136" y="688" font-size="23" fill="#25723f" font-weight="700" text-anchor="middle">緑の位置</text>
<path d="M186 584L325 584" fill="none" stroke="#546573" stroke-width="2.5"/>
<text x="252" y="560" font-size="19" fill="#546573" font-weight="400" text-anchor="middle">対応</text>
<rect x="325" y="531" width="447" height="169" rx="8" fill="#fff4d7" stroke="#79520e" stroke-width="2"/>
<rect x="342" y="544" width="87" height="44" rx="4" fill="white" stroke="#79520e" stroke-width="2"/>
<text x="386" y="574" font-size="30" fill="#79520e" font-weight="700" text-anchor="middle" class="symbol">r<tspan font-size="68%" baseline-shift="-6">C</tspan></text>
<text x="450" y="573" font-size="23" fill="#79520e" font-weight="700" text-anchor="start">記録カード C</text>
<text x="346" y="621" font-size="21" fill="#223442" font-weight="400" text-anchor="start">カウンタ：K / 緑の位置 / c<tspan font-size="68%" baseline-shift="-4.2" fill="#25723f">緑</tspan></text>
<text x="346" y="657" font-size="22" fill="#223442" font-weight="400" text-anchor="start">スイッチ入力：b<tspan font-size="68%" baseline-shift="-4.4">C</tspan></text>
<text x="346" y="688" font-size="22" fill="#223442" font-weight="400" text-anchor="start">その状態：閉</text>
<text x="28" y="766" font-size="22" fill="#546573" font-weight="400" text-anchor="start">線は、各記録がどの入力を指定しているかを示す。</text>
</svg>