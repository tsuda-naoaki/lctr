<text x="28" y="81" font-size="21" fill="#b13434" font-weight="400" text-anchor="start">red circle</text>
<text x="195" y="81" font-size="21" fill="#145b93" font-weight="400" text-anchor="start">blue triangle</text>
<text x="398" y="81" font-size="21" fill="#25723f" font-weight="400" text-anchor="start">green diamond</text>
<text x="108" y="125" font-size="22" fill="#223442" font-weight="700" text-anchor="middle">Input</text>
