<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="745" viewBox="0 0 1000 745" role="img" aria-labelledby="title desc">
<title id="title">From coloured inputs to assigned real values</title><desc id="desc">The red-circle input c_red, blue-triangle input c_blue and green-diamond input c_green belong to separate classes T_red, T_blue and T_green. Each class enclosure retains its original input. They map to order coordinates [T_red], [T_blue] and [T_green] and then to assigned real values τ_red, τ_blue and τ_green.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#546573"/></marker></defs>
<style>text{font-family:"Hiragino Sans","Noto Sans CJK JP",Arial,sans-serif} .symbol{font-family:"Times New Roman",serif}</style>
