<text x="592" y="125" font-size="22" fill="#546573" font-weight="700" text-anchor="middle">Order coordinate</text>
<text x="859" y="125" font-size="22" fill="#a13d0b" font-weight="700" text-anchor="middle">Assigned real value</text>
