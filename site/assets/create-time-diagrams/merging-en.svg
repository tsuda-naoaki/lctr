<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" role="img" aria-labelledby="title desc">
<title id="title">Merging by switch value breaks the order here</title><desc id="desc">The relation runs from the red class T_red to the blue class T_blue and from the blue class T_blue to the green class T_green. Merging the red and green inputs into M because their recorded switch states are both Closed leaves both directions between M and T_blue, violating the order conditions while they remain distinct.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#546573"/></marker></defs>
<style>text{font-family:"Hiragino Sans","Noto Sans CJK JP",Arial,sans-serif} .symbol{font-family:"Times New Roman",serif}</style>
<rect width="800" height="570" rx="16" fill="white"/>
<text x="28" y="40" font-size="26" fill="#223442" font-weight="700" text-anchor="start">Merging by switch value breaks the order here</text>
<text x="28" y="77" font-size="21" fill="#b13434" font-weight="400" text-anchor="start">red circle</text>
<text x="195" y="77" font-size="21" fill="#145b93" font-weight="400" text-anchor="start">blue triangle</text>
<text x="398" y="77" font-size="21" fill="#25723f" font-weight="400" text-anchor="start">green diamond</text>
<text x="28" y="112" font-size="22" fill="#223442" font-weight="700" text-anchor="start">The order constructed in this example</text>
<rect x="39" y="129" width="178" height="90" rx="18" fill="#f3edfc" stroke="#70459c" stroke-width="3"/>
<text x="88" y="181" font-size="25" fill="#70459c" font-weight="600" text-anchor="middle" class="symbol">T<tspan font-size="68%" baseline-shift="-5" fill="#b13434">red</tspan></text>
<circle cx="170" cy="174" r="30" fill="#fff0ee" stroke="#b13434" stroke-width="3"/>
<text x="170" y="176" font-size="22" fill="#b13434" font-weight="600" text-anchor="middle" class="symbol">c<tspan font-size="68%" baseline-shift="-4.4" fill="#b13434">red</tspan></text>
<rect x="311" y="129" width="178" height="90" rx="18" fill="#f3edfc" stroke="#70459c" stroke-width="3"/>
<text x="360" y="181" font-size="25" fill="#70459c" font-weight="600" text-anchor="middle" class="symbol">T<tspan font-size="68%" baseline-shift="-5" fill="#145b93">blue</tspan></text>
<path d="M442 144L479.5 204L404.5 204Z" fill="#e8f3ff" stroke="#145b93" stroke-width="3"/>
<text x="442" y="187" font-size="22" fill="#145b93" font-weight="600" text-anchor="middle" class="symbol">c<tspan font-size="68%" baseline-shift="-4.4" fill="#145b93">blue</tspan></text>
<rect x="583" y="129" width="178" height="90" rx="18" fill="#f3edfc" stroke="#70459c" stroke-width="3"/>
<text x="632" y="181" font-size="25" fill="#70459c" font-weight="600" text-anchor="middle" class="symbol">T<tspan font-size="68%" baseline-shift="-5" fill="#25723f">green</tspan></text>
<path d="M714 144L753.0 174L714 204L675.0 174Z" fill="#ecf7ec" stroke="#25723f" stroke-width="3"/>
<text x="714" y="176" font-size="22" fill="#25723f" font-weight="600" text-anchor="middle" class="symbol">c<tspan font-size="68%" baseline-shift="-4.4" fill="#25723f">green</tspan></text>
<path d="M224 174L301 174" fill="none" stroke="#546573" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M496 174L573 174" fill="none" stroke="#546573" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="28" y="259" font-size="22" fill="#223442" font-weight="700" text-anchor="start">Suppose red and green are merged into M</text>
<text x="28" y="291" font-size="22" fill="#223442" font-weight="400" text-anchor="start">because both recorded switch states are Closed</text>
<rect x="48" y="315" width="247" height="143" rx="24" fill="#f3edfc" stroke="#70459c" stroke-width="3"/>
<text x="171" y="354" font-size="31" fill="#70459c" font-weight="700" text-anchor="middle" class="symbol">M</text>
<circle cx="118" cy="408" r="32" fill="#fff0ee" stroke="#b13434" stroke-width="3"/>
<text x="118" y="410" font-size="25" fill="#b13434" font-weight="600" text-anchor="middle" class="symbol">c<tspan font-size="68%" baseline-shift="-5" fill="#b13434">red</tspan></text>
<path d="M224 376L265.6 408L224 440L182.4 408Z" fill="#ecf7ec" stroke="#25723f" stroke-width="3"/>
<text x="224" y="410" font-size="25" fill="#25723f" font-weight="600" text-anchor="middle" class="symbol">c<tspan font-size="68%" baseline-shift="-5" fill="#25723f">green</tspan></text>
<rect x="546" y="315" width="205" height="143" rx="24" fill="#f3edfc" stroke="#70459c" stroke-width="3"/>
<text x="648" y="354" font-size="31" fill="#70459c" font-weight="700" text-anchor="middle" class="symbol">T<tspan font-size="68%" baseline-shift="-6.2" fill="#145b93">blue</tspan></text>
<path d="M648 376L688.0 440L608.0 440Z" fill="#e8f3ff" stroke="#145b93" stroke-width="3"/>
<text x="648" y="421" font-size="25" fill="#145b93" font-weight="600" text-anchor="middle" class="symbol">c<tspan font-size="68%" baseline-shift="-5" fill="#145b93">blue</tspan></text>
<path d="M303 359L536 359" fill="none" stroke="#546573" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="420" y="340" font-size="23" fill="#546573" font-weight="400" text-anchor="middle" class="symbol">M → T<tspan font-size="68%" baseline-shift="-4.6" fill="#145b93">blue</tspan></text>
<path d="M537 434L305 434" fill="none" stroke="#546573" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="420" y="416" font-size="23" fill="#546573" font-weight="400" text-anchor="middle" class="symbol">T<tspan font-size="68%" baseline-shift="-4.6" fill="#145b93">blue</tspan> → M</text>
<text x="28" y="504" font-size="22" fill="#223442" font-weight="700" text-anchor="start">M and T<tspan font-size="68%" baseline-shift="-4.4" fill="#145b93">blue</tspan> are distinct, yet the relation runs in both directions.</text>
<text x="28" y="543" font-size="22" fill="#223442" font-weight="400" text-anchor="start">This merger fails to preserve the order of distinct positions.</text>
</svg>